<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voxel Character Studio</title>
<!--
  ===========================================================================
  VOXEL CHARACTER STUDIO  (tools/voxel_character_studio/index.html)
  ===========================================================================
  Procedurally generates BIPEDAL characters/creatures (human/goblin/dwarf/
  Ashfallen) as cubic voxels in a strict T-POSE at 18 voxels/metre. Exports the
  shared voxel JSON (with an embedded RGB palette) — feed it to
  tools/blender/import_voxel_json.py -> Blender -> Mixamo auto-rig -> .glb.
  This replaces the Nano-Banana -> Meshy step of the character pipeline.

  T-pose: arms straight out, legs vertical, palms down, symmetric. Open via the
  githack URL (ES modules + worker need HTTP, not file://).
  ===========================================================================
-->
<style>
  :root { --panel:#1b1f24; --ink:#e7e3d8; --accent:#c79a6a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:ui-monospace,Menlo,Consolas,monospace; }
  #app { display:flex; height:100%; background:#0e1013; color:var(--ink); }
  #view { flex:1; position:relative; }
  #panel { width:340px; background:var(--panel); padding:14px 16px; overflow-y:auto; border-right:1px solid #000; box-shadow:2px 0 12px #0008; }
  h1 { font-size:15px; margin:0 0 2px; color:var(--accent); letter-spacing:.5px; }
  .sub { font-size:11px; opacity:.55; margin:0 0 12px; line-height:1.4; }
  details { border-top:1px solid #ffffff14; padding:4px 0; }
  summary { font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:.7; cursor:pointer; padding:6px 0; display:flex; justify-content:space-between; align-items:center; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary .chip { background:#2a3138; border:none; color:var(--ink); font-size:12px; padding:2px 7px; border-radius:4px; cursor:pointer; }
  .param { font-size:11px; margin:0 0 9px; }
  .prow { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; gap:6px; }
  .prow .lbl { flex:1; }
  .val { color:var(--accent); }
  .lock { cursor:pointer; opacity:.4; font-size:12px; user-select:none; }
  .lock.on { opacity:1; color:var(--accent); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  select, input[type=password] { width:100%; background:#11151a; color:var(--ink); border:1px solid #000; padding:5px; font-family:inherit; font-size:11px; }
  .btns { display:flex; gap:8px; margin:8px 0; }
  button { flex:1; background:#2a3138; color:var(--ink); border:1px solid #000; padding:9px 6px; font-family:inherit; font-size:11px; cursor:pointer; border-radius:4px; }
  button:hover { background:#353d46; }
  button.primary { background:var(--accent); color:#1a1206; font-weight:bold; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; }
  .quick button { flex:1 1 30%; padding:8px 4px; }
  label.inline { display:block; font-size:11px; margin:0 0 8px; }
  #stats { font-size:11px; opacity:.85; margin-top:6px; line-height:1.7; border-top:1px solid #ffffff14; padding-top:10px; }
  #stats b { color:var(--accent); }
  #busy { font-size:11px; color:#d8a35a; height:14px; margin-top:10px; }
  .hint { position:absolute; bottom:10px; left:12px; font-size:11px; opacity:.4; }
  #ref-overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; opacity:0; z-index:5; }
  #view.dragging::after { content:"Drop reference image"; position:absolute; inset:12px; z-index:10; border:2px dashed var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:18px; background:#c79a6a18; }
  #ref-thumb { width:100%; border:1px solid #000; border-radius:4px; margin-bottom:6px; display:none; background:#000; }
  #panelToggle { position:absolute; top:10px; right:10px; z-index:11; display:none; width:auto; flex:none; background:#2a3138cc; border:1px solid #000; border-radius:6px; padding:8px 12px; font-size:16px; color:var(--ink); cursor:pointer; }
  #humanToggle { position:absolute; top:10px; left:10px; z-index:11; width:auto; flex:none; background:#2a3138cc; border:1px solid #000; border-radius:6px; padding:8px 12px; font-size:13px; color:var(--ink); cursor:pointer; }
  #humanToggle.on { background:var(--accent); color:#1a1206; }
  @media (max-width: 760px) {
    #app { flex-direction:column; }
    #panel { width:100%; max-height:48vh; border-right:none; border-bottom:1px solid #000; }
    #view { min-height:52vh; }
    #panelToggle { display:block; }
    #app.panel-hidden #panel { display:none; }
    #app.panel-hidden #view { min-height:100vh; }
    input[type=range] { height:26px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>🧍 Voxel Character Studio</h1>
    <p class="sub">T-pose biped voxels (18 vox/m). Pick a species, tune, randomize, or fit a reference with Claude. Export → Blender → Mixamo rig.</p>

    <details open>
      <summary><span>Reference &amp; Claude</span></summary>
      <img id="ref-thumb" alt="reference">
      <div class="param">
        <div class="prow"><span class="lbl">Reference overlay</span><span class="val" id="refOpacity-v">0%</span></div>
        <input type="range" id="refOpacity" min="0" max="100" value="0" step="1">
      </div>
      <div class="btns"><button id="loadRef">📎 Image…</button><button id="clearRef">✕ Clear</button></div>
      <label class="inline">Anthropic API key (stored locally, used in your browser)
        <input type="password" id="apiKey" placeholder="sk-ant-...">
      </label>
      <button id="fitRef" class="primary" style="width:100%">✨ Fit dials with Claude vision</button>
      <p id="fitNote" class="sub" style="margin:6px 0 0"></p>
      <input type="file" id="refFile" accept="image/*" style="display:none">
    </details>

    <details open>
      <summary><span>Quick adjust</span></summary>
      <div class="quick">
        <button data-quick="taller">⬆ Taller</button>
        <button data-quick="shorter">⬇ Shorter</button>
        <button data-quick="bulkier">💪 Bulkier</button>
        <button data-quick="leaner">🦴 Leaner</button>
        <button data-quick="bighead">🗣 Bigger head</button>
        <button data-quick="smallhead">🤏 Smaller head</button>
        <button data-quick="gobliny">👺 More goblin-y</button>
        <button data-quick="newseed">🎲 New seed</button>
      </div>
    </details>

    <div id="groups"></div>

    <details open>
      <summary><span>Display &amp; Export</span></summary>
      <label class="inline"><input type="checkbox" id="showHuman" checked> Show 1.8 m human for scale</label>
      <div class="btns"><button id="randomize">🎲 Randomize all</button><button id="export" class="primary">⬇ Export JSON</button></div>
    </details>

    <div id="busy"></div>
    <div id="stats"></div>
  </div>

  <div id="view">
    <img id="ref-overlay" alt="">
    <button id="humanToggle" title="Toggle 1.8 m human for scale">🧍 Scale</button>
    <button id="panelToggle" title="Show/hide panel">☰</button>
    <div class="hint">drag = orbit · pinch = zoom · drop image = reference · T-POSE</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildCharacter, CMAT } from './character_builder.js';
import { analyzeCharacterImage } from './claude_character.js';
import { makeHumanFigure, placeFigureBeside } from '../voxel_studio_common/scale_figure.js';

const M_PER_VOXEL = 1 / 18;
const m = v => (v * M_PER_VOXEL).toFixed(2) + 'm';
const MAT_NAMES = { 40:'skin',41:'skin_shadow',42:'cloth',43:'leather',44:'metal',45:'hair',46:'eye',47:'dark',48:'tooth',49:'accent' };

// Base palette (hex). Species override individual ids. activePalette is current.
const BASE_HEX = { 40:'#c08a5e',41:'#9c6e48',42:'#5a6b8c',43:'#5a3f28',44:'#8a8d92',45:'#2a1f12',46:'#202020',47:'#3a2f22',48:'#e8e2c8',49:'#7a3b3b' };
let activeHex = { ...BASE_HEX };
let PALETTE = {}; // id -> THREE.Color
function rebuildPalette() { PALETTE = {}; for (const id in activeHex) PALETTE[id] = new THREE.Color(activeHex[id]); }

// ---------------------------------------------------------------------------
// Species presets: param overrides + palette colour overrides
// ---------------------------------------------------------------------------
const SPECIES = {
  Human:  { params:{ heightM:1.8, build:1.0, headSize:0.17, shoulderWidth:0.16, bareChest:0, loincloth:0, armor:0, visor:0, beard:0, earSize:0.35, earPoint:0, snout:0, tuskSize:0, eyeGlow:0, fingers:5 },
            colors:{ 40:'#c08a5e', 42:'#4f6e8c', 45:'#2a1f12' } },
  Goblin: { params:{ heightM:1.8, build:0.78, headSize:0.20, shoulderWidth:0.12, bareChest:1, loincloth:1, armor:0, visor:0, beard:0, earSize:0.95, earPoint:1, snout:0.5, tuskSize:0.6, eyeGlow:1, fingers:3 },
            colors:{ 40:'#6f9a4a', 41:'#4f6e34', 46:'#7CFC00', 47:'#332a1a', 48:'#d9d3b2' } },
  Dwarf:  { params:{ heightM:1.4, build:1.3, headSize:0.18, shoulderWidth:0.21, bareChest:0, loincloth:0, armor:0, visor:0, beard:1.0, earSize:0.35, earPoint:0, snout:0, tuskSize:0, eyeGlow:0, fingers:5 },
            colors:{ 40:'#d0a070', 42:'#6a4d2e', 45:'#8a3b18' } },
  Ashfallen:{ params:{ heightM:1.95, build:1.1, headSize:0.16, shoulderWidth:0.19, bareChest:0, loincloth:0, armor:1, visor:1, beard:0, earSize:0, earPoint:0, snout:0, tuskSize:0, eyeGlow:1, fingers:5 },
            colors:{ 44:'#6f7378', 46:'#c0392b' } },
};

// ---------------------------------------------------------------------------
// Parameter schema (ids match buildCharacter() keys)
// ---------------------------------------------------------------------------
const SCHEMA = [
  { group:'General', params:[
    { id:'species', label:'Species', noRandom:true, select:['Human','Goblin','Dwarf','Ashfallen'], def:'Human' },
    { id:'seed', label:'Seed', min:1, max:9999, step:1, def:5 },
    { id:'build', label:'Build (lean↔heavy)', min:0.7, max:1.4, step:0.05, def:1.0 },
  ]},
  { group:'Proportions', params:[
    { id:'heightM', label:'Height (m)', min:1.2, max:2.1, step:0.05, def:1.8 },
    { id:'headSize', label:'Head size', min:0.13, max:0.24, step:0.01, def:0.17 },
    { id:'neckLength', label:'Neck', min:0, max:0.05, step:0.005, def:0.015 },
    { id:'shoulderWidth', label:'Shoulders', min:0.10, max:0.24, step:0.01, def:0.16 },
    { id:'torsoDepth', label:'Torso depth', min:0.04, max:0.12, step:0.005, def:0.07 },
    { id:'hipWidth', label:'Hips', min:0.08, max:0.16, step:0.005, def:0.11 },
    { id:'armLength', label:'Arm length', min:0.30, max:0.50, step:0.01, def:0.40 },
    { id:'armThickness', label:'Arm thickness', min:0.03, max:0.08, step:0.005, def:0.045 },
    { id:'legThickness', label:'Leg thickness', min:0.035, max:0.09, step:0.005, def:0.055 },
    { id:'handSize', label:'Hand size', min:0.03, max:0.08, step:0.005, def:0.05 },
    { id:'footSize', label:'Foot length', min:0.06, max:0.13, step:0.005, def:0.09 },
  ]},
  { group:'Head / Face', params:[
    { id:'headShape', label:'Head shape', noRandom:false, select:['round','square','long'], def:'round' },
    { id:'browHeight', label:'Brow', min:0, max:1, step:0.1, def:0.5 },
    { id:'jawWidth', label:'Jaw', min:0, max:1, step:0.1, def:0.5 },
    { id:'earSize', label:'Ears', min:0, max:1, step:0.05, def:0.35 },
    { id:'earPoint', label:'Ear point', min:0, max:1, step:0.1, def:0 },
    { id:'snout', label:'Snout', min:0, max:1, step:0.05, def:0 },
    { id:'tuskSize', label:'Tusks', min:0, max:1, step:0.05, def:0 },
  ]},
  { group:'Features', params:[
    { id:'eyeGlow', label:'Glowing eyes', min:0, max:1, step:1, def:0 },
    { id:'bareChest', label:'Bare chest', min:0, max:1, step:1, def:0 },
    { id:'loincloth', label:'Loincloth', min:0, max:1, step:1, def:0 },
    { id:'beard', label:'Beard', min:0, max:1, step:0.1, def:0 },
    { id:'armor', label:'Armor', min:0, max:1, step:1, def:0 },
    { id:'visor', label:'Visor head', min:0, max:1, step:1, def:0 },
    { id:'fingers', label:'Fingers', min:3, max:5, step:1, def:5 },
  ]},
];
const PARAMS = {}; SCHEMA.forEach(g => g.params.forEach(p => PARAMS[p.id] = p));

// ---------------------------------------------------------------------------
// Build UI from schema
// ---------------------------------------------------------------------------
const el = {}; const groupsHost = document.getElementById('groups');
for (const g of SCHEMA) {
  const d = document.createElement('details'); d.open = (g.group === 'General' || g.group === 'Proportions');
  const s = document.createElement('summary');
  s.innerHTML = `<span>${g.group}</span><span class="chip" title="Randomize this group">🎲</span>`;
  s.querySelector('.chip').addEventListener('click', e => { e.preventDefault(); g.params.forEach(randomizeOne); scheduleRegen(); });
  d.appendChild(s);
  for (const p of g.params) {
    const wrap = document.createElement('div'); wrap.className = 'param';
    if (p.select) {
      wrap.innerHTML = `<div class="prow"><span class="lbl">${p.label}</span><span class="lock" data-lock="${p.id}">🔓</span></div>`;
      const sel = document.createElement('select'); sel.id = p.id;
      p.select.forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; sel.appendChild(op); });
      sel.value = p.def; wrap.appendChild(sel); el[p.id] = sel;
    } else {
      wrap.innerHTML = `<div class="prow"><span class="lbl">${p.label}</span><span><span class="val" id="${p.id}-v"></span> <span class="lock" data-lock="${p.id}">🔓</span></span></div>` +
        `<input type="range" id="${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}">`;
      d.appendChild(wrap); el[p.id] = wrap.querySelector('input'); continue;
    }
    d.appendChild(wrap);
  }
  groupsHost.appendChild(d);
}
const locks = {};
document.querySelectorAll('[data-lock]').forEach(node => {
  const id = node.getAttribute('data-lock');
  node.addEventListener('click', () => { locks[id] = !locks[id]; node.classList.toggle('on', locks[id]); node.textContent = locks[id] ? '🔒' : '🔓'; });
});
Object.values(el).forEach(node => node.addEventListener('input', scheduleRegen));

function readParams() { const p = {}; for (const id in el) p[id] = el[id].tagName === 'SELECT' ? el[id].value : +el[id].value; return p; }
function syncLabels() { for (const id in el) { const v = document.getElementById(id+'-v'); if (v && PARAMS[id] && !PARAMS[id].select) v.textContent = el[id].value; } }
function setVal(id, v) { if (el[id]===undefined || v===undefined || v===null) return; const p = PARAMS[id]; if (p.select) el[id].value = v; else el[id].value = Math.max(p.min, Math.min(p.max, +v)); }
function randInRange(p) { const steps = Math.round((p.max-p.min)/p.step); return p.min + Math.round(Math.random()*steps)*p.step; }
function randomizeOne(p) { if (locks[p.id] || p.noRandom) return; if (p.select) el[p.id].value = p.select[Math.floor(Math.random()*p.select.length)]; else el[p.id].value = randInRange(p); }
document.getElementById('randomize').addEventListener('click', () => { SCHEMA.forEach(g => g.params.forEach(randomizeOne)); scheduleRegen(); });

// species preset (params + palette)
function applySpecies(name) {
  const s = SPECIES[name]; if (!s) return;
  for (const id in s.params) setVal(id, s.params[id]);
  activeHex = { ...BASE_HEX, ...(s.colors || {}) }; rebuildPalette();
}
el.species.addEventListener('change', () => { applySpecies(el.species.value); scheduleRegen(); });

// quick-adjust easy buttons
function nudge(id, d) { if (!locks[id] && el[id]) setVal(id, +el[id].value + d); }
const QUICK = {
  taller:    () => nudge('heightM', 0.1),
  shorter:   () => nudge('heightM', -0.1),
  bulkier:   () => { nudge('build', 0.15); nudge('shoulderWidth', 0.01); },
  leaner:    () => { nudge('build', -0.15); nudge('shoulderWidth', -0.01); },
  bighead:   () => nudge('headSize', 0.02),
  smallhead: () => nudge('headSize', -0.02),
  gobliny:   () => { nudge('earSize', 0.2); nudge('earPoint', 0.3); nudge('snout', 0.2); nudge('tuskSize', 0.2); if (!locks.eyeGlow) setVal('eyeGlow', 1); },
  newseed:   () => { if (!locks.seed) el.seed.value = 1 + Math.floor(Math.random()*9999); },
};
document.querySelectorAll('[data-quick]').forEach(b => b.addEventListener('click', () => { QUICK[b.getAttribute('data-quick')](); scheduleRegen(); }));

// ---------------------------------------------------------------------------
// THREE scene
// ---------------------------------------------------------------------------
const view = document.getElementById('view');
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0e1013');
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 4000); camera.position.set(40, 24, 52);
const renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.target.set(0, 16, 0);
scene.add(new THREE.HemisphereLight('#cfe3ff', '#34301f', 1.05));
const sun = new THREE.DirectionalLight('#fff4d6', 1.15); sun.position.set(30, 60, 25); scene.add(sun);
const fill = new THREE.DirectionalLight('#9fb8d8', 0.35); fill.position.set(-30, 30, -40); scene.add(fill);
scene.add(new THREE.GridHelper(72, 36, 0x444a52, 0x2a2f36));

// 1.8 m human for scale (~18 voxels) — placed beside the character.
const human = makeHumanFigure(THREE); let humanShown = false;
function updateHuman(sizeVox) {
  const on = document.getElementById('showHuman').checked;
  if (on) { human.scale.setScalar(18 / 18); placeFigureBeside(human, sizeVox); if (!humanShown) { scene.add(human); humanShown = true; } }
  else if (humanShown) { scene.remove(human); humanShown = false; }
}

const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const cubeMat = new THREE.MeshLambertMaterial();
let mesh = null;
function rebuildMesh(positions, materials) {
  if (mesh) { scene.remove(mesh); mesh.dispose(); }
  const n = materials.length;
  mesh = new THREE.InstancedMesh(cubeGeo, cubeMat, n);
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n*3), 3);
  const dummy = new THREE.Object3D(), c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const x = positions[i*3], y = positions[i*3+1], z = positions[i*3+2];
    dummy.position.set(x, y, z); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
    const base = PALETTE[materials[i]] || PALETTE[40];
    const j = 0.9 + ((Math.sin(x*12.9+y*78.2+z*37.7)*43758.5)%1+1)%1*0.18;
    c.copy(base).multiplyScalar(j); mesh.setColorAt(i, c);
  }
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true; scene.add(mesh);
}

// ---------------------------------------------------------------------------
// Worker + regenerate
// ---------------------------------------------------------------------------
let worker = null;
try { worker = new Worker(new URL('./character.worker.js', import.meta.url), { type:'module' }); } catch (e) { worker = null; }
let voxReqId = 0; const voxPending = new Map();
function disableWorker() { worker = null; for (const [, en] of voxPending) { clearTimeout(en.timer); en.inline(); } voxPending.clear(); }
if (worker) {
  worker.onmessage = e => { const en = voxPending.get(e.data.reqId); if (!en) return; voxPending.delete(e.data.reqId); clearTimeout(en.timer); if (e.data.ok) en.finish(e.data); else en.inline(); };
  worker.onerror = () => disableWorker();
}
function runBuild(params) {
  return new Promise(resolve => {
    const inline = () => resolve(buildCharacter(params));
    if (!worker) { inline(); return; }
    const reqId = ++voxReqId; let done = false;
    const finish = d => { if (!done) { done = true; resolve(d); } };
    const inlineOnce = () => { if (!done) { done = true; inline(); } };
    const timer = setTimeout(() => { voxPending.delete(reqId); inlineOnce(); }, 4000);
    voxPending.set(reqId, { finish, inline: inlineOnce, timer });
    try { worker.postMessage({ reqId, params }); } catch (e) { clearTimeout(timer); voxPending.delete(reqId); inlineOnce(); }
  });
}
const busyEl = document.getElementById('busy'); function setBusy(b) { busyEl.textContent = b ? '⏳ generating…' : ''; }

let regenTimer = null, regenToken = 0, lastExport = null;
function scheduleRegen() { syncLabels(); clearTimeout(regenTimer); regenTimer = setTimeout(regenerate, 100); }
async function regenerate() {
  syncLabels();
  const params = readParams(); const token = ++regenToken;
  setBusy(true);
  const { positions, materials, stats } = await runBuild(params);
  if (token !== regenToken) return; setBusy(false);
  rebuildMesh(positions, materials);
  lastExport = { positions, materials, stats, params };
  controls.target.set(0, stats.sizeVox[1] * 0.5, 0);
  updateHuman(stats.sizeVox);
  const conn = stats.disconnected === 0 ? `<span style="color:#8fbf6f">✓ one connected body</span>` : `<span style="color:#d8a35a">⚠ ${stats.disconnected} detached</span>`;
  document.getElementById('stats').innerHTML =
    `<b>${stats.total.toLocaleString()}</b> voxels · <b>${m(stats.sizeVox[1])}</b> tall<br>` +
    `size <b>${stats.sizeVox[0]}×${stats.sizeVox[1]}×${stats.sizeVox[2]}</b> vox &nbsp;<span style="opacity:.5">T-pose @ 18 vox/m</span><br>` + conn;
}

// ---------------------------------------------------------------------------
// Reference overlay + Claude vision fit
// ---------------------------------------------------------------------------
const overlay = document.getElementById('ref-overlay'), refThumb = document.getElementById('ref-thumb'),
      refOpacity = document.getElementById('refOpacity'), refFile = document.getElementById('refFile');
function setReference(src) {
  if (src) { overlay.src = src; refThumb.src = src; refThumb.style.display='block'; if (+refOpacity.value===0) refOpacity.value=45; }
  else { overlay.removeAttribute('src'); refThumb.removeAttribute('src'); refThumb.style.display='none'; refOpacity.value=0; }
  applyOpacity();
}
function applyOpacity() { overlay.style.opacity = (+refOpacity.value/100).toString(); document.getElementById('refOpacity-v').textContent = refOpacity.value+'%'; }
refOpacity.addEventListener('input', applyOpacity);
document.getElementById('loadRef').addEventListener('click', () => refFile.click());
refFile.addEventListener('change', () => { const f = refFile.files[0]; if (!f) return; const r = new FileReader(); r.onload = e => setReference(e.target.result); r.readAsDataURL(f); });
document.getElementById('clearRef').addEventListener('click', () => setReference(null));
view.addEventListener('dragover', e => { e.preventDefault(); view.classList.add('dragging'); });
view.addEventListener('dragleave', () => view.classList.remove('dragging'));
view.addEventListener('drop', e => { e.preventDefault(); view.classList.remove('dragging'); const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/')); if(!f)return; const r=new FileReader(); r.onload=ev=>setReference(ev.target.result); r.readAsDataURL(f); });

const apiKeyEl = document.getElementById('apiKey');
apiKeyEl.value = localStorage.getItem('anthropic_api_key') || '';
apiKeyEl.addEventListener('change', () => localStorage.setItem('anthropic_api_key', apiKeyEl.value.trim()));

document.getElementById('fitRef').addEventListener('click', async () => {
  const note = document.getElementById('fitNote'); const src = overlay.getAttribute('src');
  if (!src) { note.textContent = 'Load a reference image first (📎 or drag one on).'; return; }
  note.textContent = '🤔 asking Claude…';
  const res = await analyzeCharacterImage(src, apiKeyEl.value.trim());
  if (res.error) { note.textContent = res.error; return; }
  const p = res.params;
  if (p.species) { applySpecies(p.species); el.species.value = p.species; }
  for (const k of ['heightM','build','headSize','shoulderWidth','earSize','earPoint','snout','tuskSize','beard','eyeGlow','bareChest','armor']) setVal(k, p[k]);
  note.textContent = `→ ${p.species} · ` + Object.entries(p).filter(([k])=>k!=='species').map(([k,v])=>`${k}=${typeof v==='number'?(+v).toFixed(2):v}`).join(', ');
  scheduleRegen();
});

// ---------------------------------------------------------------------------
// Export (embeds the RGB palette so Blender colors it with no engine wiring)
// ---------------------------------------------------------------------------
document.getElementById('export').addEventListener('click', () => {
  if (!lastExport) return;
  const { positions, materials, stats, params } = lastExport;
  const usedIds = [...new Set(materials)];
  const palette = {}; for (const id of usedIds) { const c = PALETTE[id] || PALETTE[40]; palette[id] = [Math.round(c.r*255), Math.round(c.g*255), Math.round(c.b*255)]; }
  const names = {}; for (const id of usedIds) names[id] = MAT_NAMES[id] || ('mat'+id);
  const voxels = [];
  for (let i = 0; i < materials.length; i++) voxels.push({ x: positions[i*3], y: positions[i*3+1], z: positions[i*3+2], m: materials[i] });
  const out = {
    format: 'mira-thal-voxel-character', version: 1, voxel_size_m: M_PER_VOXEL,
    note: 'T-pose biped. Mesh+vertex-bake in Blender, then Mixamo auto-rig. Embedded palette = id->[r,g,b].',
    species: params.species, palette, palette_names: names,
    size: stats.sizeVox, size_m: stats.sizeVox.map(n => +(n*M_PER_VOXEL).toFixed(3)),
    params, voxels,
  };
  const blob = new Blob([JSON.stringify(out)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `char_${params.species}_seed${params.seed}.json`; a.click(); URL.revokeObjectURL(a.href);
});

// scale toggle (button + checkbox)
const showHumanEl = document.getElementById('showHuman'), humanToggle = document.getElementById('humanToggle');
function syncHuman() { humanToggle.classList.toggle('on', showHumanEl.checked); if (lastExport) updateHuman(lastExport.stats.sizeVox); }
showHumanEl.addEventListener('change', syncHuman);
humanToggle.addEventListener('click', () => { showHumanEl.checked = !showHumanEl.checked; syncHuman(); });
document.getElementById('panelToggle').addEventListener('click', () => document.getElementById('app').classList.toggle('panel-hidden'));

// resize + loop + boot
function resize() { const w=view.clientWidth,h=view.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); }
applySpecies('Human'); humanToggle.classList.toggle('on', true); syncLabels(); regenerate(); loop();
</script>
</body>
