<defs>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="15%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.82"/>
  </radialGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0C0805"/>
    <stop offset="100%" stop-color="#0C0805" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fog-bottom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0C0805" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0C0805"/>
  </linearGradient>
  <radialGradient id="ui-shadow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
</defs>

