<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Voxelmark — Loading</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  @font-face{
    font-family: "Macondo Swash Caps";
    src: url("fonts/MacondoSwashCaps-Regular.ttf") format("truetype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root{
    --warm-primary:#E8873A; --warm-secondary:#8B3A1A; --warm-highlight:#F5D06E;
    --sand-bright:#F5D06E; --sand-mid:#D9A84A; --sand-deep:#A87320;
    --brass-1:#d8a050; --brass-2:#a87320; --brass-3:#6b4520; --brass-4:#3a2410;
    --parchment:#e6d5a8;
    --leather-1:#3a2412; --leather-2:#2a180a;
    --serif:"Macondo Swash Caps", serif;
    --hand:"IM Fell English","Cormorant Garamond",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--hand);color:var(--parchment);background:#000;
    overflow:hidden;user-select:none;
  }

  .bg{
    position:absolute;inset:0;
    background:url("assets/menu_backgrounds/cave_background1.jpg") center/cover no-repeat;
  }
  .tint{position:absolute;inset:0;background:rgba(0,0,0,0.62)}
  .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 240px rgba(0,0,0,0.7)}
  .grain{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,180,80,0.018) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }

  .stack{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:18px;
    width:780px;max-width:calc(100vw - 40px);
  }

  /* =========================================================
     SMALL HOURGLASS — ~1/4 prior size.
     hg element 40 × 60 px. Particles are 1.5px squares falling
     through the waist into a growing mound at the bottom.
     ========================================================= */
  .hg-stage{
    perspective:600px;
    width:80px;height:90px;
    display:grid;place-items:center;
    margin-bottom:4px;
  }
  .hg{
    position:relative;
    width:40px;height:60px;
    transform-style:preserve-3d;
    animation:hgBob 5.2s ease-in-out infinite;
  }
  @keyframes hgBob{
    0%,100%{ transform: rotateX(-10deg) rotateY(-14deg) translateY(0) }
    50%   { transform: rotateX(-10deg) rotateY(-10deg) translateY(-2px) }
  }

  /* brass caps */
  .cap{
    position:absolute;left:-6px;right:-6px;height:6px;
    background:linear-gradient(180deg,var(--brass-1) 0%,var(--brass-2) 50%,var(--brass-4) 100%);
    border:1px solid #000;
    box-shadow:inset 0 1px 0 rgba(255,210,120,0.6),inset 0 -1px 0 rgba(0,0,0,0.5);
  }
  .cap.top{top:-3px}
  .cap.bot{bottom:-3px}

  /* brass support pillars */
  .pillar{
    position:absolute;top:2px;bottom:2px;width:2px;
    background:linear-gradient(180deg,var(--brass-1),var(--brass-3) 50%,var(--brass-4));
    border:1px solid #000;
  }
  .pillar.fl{left:-4px}
  .pillar.fr{right:-4px}
  .pillar.bl{left:-4px;transform:translateZ(-12px);filter:brightness(0.55)}
  .pillar.br{right:-4px;transform:translateZ(-12px);filter:brightness(0.55)}

  /* glass body — thin gold outline */
  .glass-outline{position:absolute;inset:0;pointer-events:none}
  .glass-outline svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

  /* particle field — overlaid SVG, viewBox 40x60 */
  .particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .particles rect{shape-rendering:crispEdges}

  /* shadow */
  .hg-shadow{
    position:absolute;left:50%;bottom:-6px;width:54px;height:5px;
    background:radial-gradient(ellipse,rgba(0,0,0,0.55) 0%,transparent 70%);
    transform:translateX(-50%);
    animation:shadowBob 5.2s ease-in-out infinite;
  }
  @keyframes shadowBob{
    0%,100%{transform:translateX(-50%) scale(1,1);opacity:0.55}
    50%   {transform:translateX(-50%) scale(0.9,0.7);opacity:0.4}
  }

  /* =========================================================
     TEXT
     ========================================================= */
  .title{
    font-family:var(--serif);font-size:40px;letter-spacing:10px;color:var(--warm-highlight);
    text-shadow:3px 3px 0 #000, 0 0 18px rgba(0,0,0,0.9);
    line-height:1;
  }
  .msg{
    font-family:var(--hand);font-style:italic;font-size:20px;color:var(--parchment);
    text-shadow:2px 2px 0 #000;text-align:center;line-height:1.3;
    min-height:48px;max-width:680px;
    transition:opacity .4s;
  }
  .pct-row{display:flex;flex-direction:column;align-items:center;gap:10px;width:520px}
  .pct{font-family:var(--serif);font-size:18px;letter-spacing:6px;color:var(--warm-highlight);text-shadow:2px 2px 0 #000}
  .bar{
    width:100%;height:8px;background:linear-gradient(180deg,#0a0604,#1a1208);
    border:1px solid #000;box-shadow:inset 0 0 0 1px var(--leather-1);
    position:relative;overflow:hidden;
  }
  .bar-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,var(--sand-deep),var(--sand-bright));
    box-shadow:0 0 8px rgba(245,208,110,0.5);
    transition:width .15s linear;
  }
  .bar-fill::after{
    content:"";position:absolute;right:0;top:0;bottom:0;width:24px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5));
  }

  .tip{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    font-family:var(--hand);font-style:italic;font-size:14px;color:rgba(230,213,168,0.55);
    text-align:center;max-width:640px;padding:0 20px;
  }
  .tip b{font-style:normal;font-family:var(--serif);letter-spacing:2px;color:var(--warm-highlight)}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="tint"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="stack">

    <div class="hg-stage">
      <div class="hg" id="hg">
        <div class="hg-shadow"></div>

        <div class="pillar bl"></div>
        <div class="pillar br"></div>

        <!-- glass outline (the diamond shape of the hourglass) -->
        <div class="glass-outline">
          <svg viewBox="0 0 40 60" preserveAspectRatio="none">
            <polygon points="0,0 40,0 21,30 40,60 0,60 19,30"
                     fill="rgba(245,208,110,0.05)" stroke="#d8a050" stroke-width="1"/>
            <polygon points="2,2 38,2 21,30 38,58 2,58 19,30"
                     fill="none" stroke="rgba(255,235,180,0.18)" stroke-width="0.5"/>
          </svg>
        </div>

        <!-- particles + static sand surfaces -->
        <svg class="particles" id="particles" viewBox="0 0 40 60" preserveAspectRatio="none">
          <!-- top sand pile (filled triangle that shrinks toward waist) -->
          <polygon id="topSand" points="0.5,0.5 39.5,0.5 20,29.5" fill="#D9A84A"/>
          <!-- top surface line -->
          <line id="topSurface" x1="0.5" y1="0.5" x2="39.5" y2="0.5" stroke="#FFE9A8" stroke-width="0.4" opacity="0.7"/>
          <!-- bottom mound (grows) -->
          <polygon id="botMound" points="20,30 20,30 20,30" fill="#A87320"/>
          <!-- particle group (filled in by JS) -->
          <g id="grainGroup"></g>
        </svg>

        <div class="pillar fl"></div>
        <div class="pillar fr"></div>
        <div class="cap top"></div>
        <div class="cap bot"></div>
      </div>
    </div>

    <div class="title">LOADING</div>
    <div class="msg" id="msg">Reticulating cave splines</div>

    <div class="pct-row">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </div>

  <div class="tip"><b>TIP</b> &nbsp; Press <b>Q</b> / <b>E</b> to cycle quick slots — your shovel won't break stone, only dirt.</div>

<script>
const TIPS = [
  "Reticulating cave splines",
  "Convincing the snow to fall convincingly",
  "Teaching Roland the difference between a shovel and a pickaxe",
  "Letting Dagna find a quiet place to sit",
  "Polishing the iron sallet (it's still dented)",
  "Counting Brotherhood archives. Recounting them. They keep changing",
  "Sharpening Orion's quill — again",
  "Asking the Ashfallen to please form an orderly line",
  "Hiding one (1) folded paper somewhere it can be found",
  "Reminding Tomlin that you said you'd be there at the bell, not after",
  "Stoking the campfire — it knows you're coming",
  "Rebinding the Crown. Or trying. The pieces don't fit yet",
  "The wind off the Spine bites tonight. Keep close to the fire"
];

const SVGNS = "http://www.w3.org/2000/svg";
const topSand = document.getElementById('topSand');
const topSurface = document.getElementById('topSurface');
const botMound = document.getElementById('botMound');
const grainGroup = document.getElementById('grainGroup');
const barFill = document.getElementById('barFill');
const pctEl = document.getElementById('pct');
const msgEl = document.getElementById('msg');

/* ========= Particle simulation =========
   Coordinate space is the SVG viewBox 40x60.
   Top half: 0..30 (waist at y=30, x=20).
   Bottom half: 30..60.
*/
const grains = [];
const MAX_GRAINS = 38;
let progress = 0;
let dropAccum = 0;

function spawnGrain(){
  // spawn at the waist with small horizontal jitter
  const g = {
    x: 20 + (Math.random() - 0.5) * 0.6,
    y: 30,
    vx: (Math.random() - 0.5) * 0.10,
    vy: 0.18 + Math.random() * 0.10,
    size: Math.random() < 0.4 ? 0.9 : 0.7,
    color: Math.random() < 0.5 ? '#F5D06E' : '#E8B850'
  };
  grains.push(g);
}

function moundApexY(p){
  // floor at 60, apex rises toward waist (30) as p→1
  return 60 - p * 30;
}

function moundContains(x, y, p){
  // Triangle: floor (0,60)-(40,60), apex at (20, apexY).
  const apexY = moundApexY(p);
  if (y < apexY) return false;
  if (y > 60) return true;
  // mound half-width at this y, lerping from 0 (apex) to 20 (floor)
  const t = (y - apexY) / (60 - apexY);
  const halfW = t * 20;
  return Math.abs(x - 20) <= halfW;
}

function tickGrains(){
  for (let i = grains.length - 1; i >= 0; i--){
    const g = grains[i];
    g.vy += 0.012;     // gravity
    g.x += g.vx;
    g.y += g.vy;
    // remove on contact with mound or floor
    if (g.y >= 60 || moundContains(g.x, g.y, progress)){
      grains.splice(i, 1);
    }
  }
}

function renderTopSand(p){
  // top sand surface y goes from 0.5 (full) to 29 (almost empty)
  const ySurf = 0.5 + p * 28.5;
  const halfW = (1 - p) * 19.5;
  const xL = 20 - halfW;
  const xR = 20 + halfW;
  topSand.setAttribute('points', `${xL},${ySurf} ${xR},${ySurf} 20,29.5`);
  topSurface.setAttribute('x1', xL);
  topSurface.setAttribute('y1', ySurf);
  topSurface.setAttribute('x2', xR);
  topSurface.setAttribute('y2', ySurf);
  topSurface.style.opacity = p < 0.97 ? 0.7 : 0;
}

function renderMound(p){
  if (p < 0.005){
    botMound.setAttribute('points', '20,30 20,30 20,30');
    return;
  }
  const apexY = moundApexY(p);
  const halfW = p * 20;
  // Triangle: apex + base corners, with slight settling bevel near apex
  const xL = 20 - halfW;
  const xR = 20 + halfW;
  botMound.setAttribute('points',
    `${xL},60 ${xR},60 ${20 + halfW*0.06},${apexY+0.5} 20,${apexY} ${20 - halfW*0.06},${apexY+0.5}`);
}

function renderGrains(){
  // diff-render: rebuild the group cheaply
  while (grainGroup.firstChild) grainGroup.removeChild(grainGroup.firstChild);
  for (const g of grains){
    const r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('x', g.x - g.size/2);
    r.setAttribute('y', g.y - g.size/2);
    r.setAttribute('width', g.size);
    r.setAttribute('height', g.size);
    r.setAttribute('fill', g.color);
    grainGroup.appendChild(r);
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(40, now - last); last = now;

  // progress easing: slow start, fast middle, slow end
  if (progress < 1){
    const x = (progress - 0.5) * 2;
    const speed = 0.0028 + (1 - x*x) * 0.0080;
    progress = Math.min(1, progress + speed);
  } else {
    // brief pause then reset for demo
    progress = (progress >= 1.05) ? 0 : progress + 0.002;
    if (progress === 0) grains.length = 0;
  }

  // spawn grains while sand is falling
  if (progress > 0.005 && progress < 0.995 && grains.length < MAX_GRAINS){
    dropAccum += dt;
    const interval = 32; // ms between spawns; bursty during mid-progress
    while (dropAccum >= interval){
      dropAccum -= interval;
      spawnGrain();
      // mid-progress: occasional double-grain for fuller stream feel
      if (progress > 0.2 && progress < 0.8 && Math.random() < 0.5) spawnGrain();
    }
  }

  tickGrains();
  renderTopSand(Math.min(progress, 1));
  renderMound(Math.min(progress, 1));
  renderGrains();

  pctEl.textContent = Math.floor(Math.min(progress, 1) * 100) + '%';
  barFill.style.width = (Math.min(progress, 1) * 100) + '%';

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

let tipIdx = 0;
function rotateTip(){
  tipIdx = (tipIdx + 1) % TIPS.length;
  msgEl.style.opacity = 0;
  setTimeout(()=>{ msgEl.textContent = TIPS[tipIdx]; msgEl.style.opacity = 1; }, 400);
}
setInterval(rotateTip, 3400);
</script>
</body>
</html>
