[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
EditorStartupMap=/Engine/Maps/Templates/OpenWorld

; ----------------------------------------------------------------------------
; Rendering — Nanite + Lumen + virtual shadow maps. The "Skyrim atmosphere"
; bet rides on these. (See design/UE5_PORT_PLAN.md "Critical risk".)
; ----------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Nanite.ProjectEnabled=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4

; Forward-shading OFF (Lumen/Nanite path is deferred). Matches the photoreal goal.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

; ----------------------------------------------------------------------------
; Networking — host/server-authoritative (Phase 4). Steam wired in MiraThalNet.
; ----------------------------------------------------------------------------
[/Script/Engine.GameNetworkManager]
TotalNetBandwidth=200000
MaxDynamicBandwidth=100000
MinDynamicBandwidth=10000
