; ----------------------------------------------------------------------------
; Remote Control — editor-iteration tooling for the mcp-unreal MCP server.
; Lets Claude Code drive the LIVE editor (spawn/inspect actors, set properties,
; run console commands, read logs) over HTTP on port 30010, instead of asking
; the designer to click buttons. This is DEV-ONLY: it auto-starts the web
; server when the editor opens so the MCP bridge can connect with no manual
; "WebControl.StartServer" step. Not shipped in packaged builds.
; ----------------------------------------------------------------------------
[ConsoleVariables]
WebControl.EnableServerOnStartup=1

; NOTE: the RemoteControlSettings (ports, bAllowConsoleCommandRemoteExecution)
; live in Config/DefaultRemoteControl.ini — that class is UCLASS(config=RemoteControl),
; so it reads from DefaultRemoteControl.ini, NOT this file.
