; DefaultRemoteControl.ini — Remote Control plugin settings (config category
; "RemoteControl", class URemoteControlSettings in module RemoteControlCommon).
; These are DEV-ONLY editor-iteration settings for the mcp-unreal bridge.

[/Script/RemoteControlCommon.RemoteControlSettings]
; Allow the MCP server to run console commands (stat unit, r.*, ShowFlag.*)
; over the web API. Safe here: server binds localhost only, single-user dev box.
bAllowConsoleCommandRemoteExecution=True
RemoteControlHttpServerPort=30010
RemoteControlWebSocketServerPort=30020
